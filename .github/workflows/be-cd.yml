name: be-cd

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/be-cd.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: be-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

defaults:
  run:
    working-directory: backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-name: ${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ [소문자 변환] GHCR은 대문자를 허용하지 않으므로 변환 처리
      - name: Set owner name and image name
        run: |
          OWNER_LC=${{ github.repository_owner }}
          OWNER_LC=${OWNER_LC,,}
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV
          
          # 이미지 이름 설정
          IMAGE_NAME="$OWNER_LC/chwimeet-backend"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        with:
          gradle-wrapper-path: backend/gradle/wrapper/gradle-wrapper.jar

      - name: Setup Java (Gradle JVM = 24)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle
          cache-dependency-path: backend/build.gradle.kts

      - name: Provision Java 25 for toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: backend

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # === JOOQ 생성용 임시 DB 시작 ===
      - name: Start MariaDB
        env:
          SPRING__DATASOURCE__PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🚀 Starting MariaDB..."
          docker compose up -d mariadb
          sleep 10

      - name: Wait for MariaDB
        env:
          SPRING__DATASOURCE__PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          MAX_TRIES=30
          COUNTER=0
          until docker exec chwimeet-mariadb mariadb-admin ping -h localhost -uroot -p${{ secrets.DB_PASSWORD }} --silent 2>/dev/null; do
            COUNTER=$((COUNTER + 1))
            if [ $COUNTER -ge $MAX_TRIES ]; then exit 1; fi
            sleep 2
          done
          echo "✅ MariaDB is ready!"

      - name: Generate JOOQ sources
        env:
          SPRING__DATASOURCE__USERNAME: root
          SPRING__DATASOURCE__PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING__DATASOURCE__URL: jdbc:mariadb://localhost:3306/chwimeet
        run: ./gradlew generateJooqClasses --no-daemon

      - name: Stop MariaDB
        if: always()
        run: docker compose down -v
      # === JOOQ 생성 종료 ===

      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 루트 디렉토리에서 실행 (backend 아님)
    defaults:
      run:
        working-directory: .

    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }} # docker login을 위한 토큰
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          echo "🚀 Sending deployment command to EC2..."
          
          # 1. 소문자 변환 (ID 대소문자 이슈 방지)
          OWNER_LC=${GH_OWNER,,}
          
          # 2. SSM 명령 전송 (가장 중요한 부분!)
          # - 환경변수(export)로 토큰을 EC2 세션에 주입
          # - 그 후 deploy.sh 실행 (스크립트가 이 토큰을 받아서 docker login 수행)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Chwimeet Backend" \
            --parameters "commands=[
              'export GITHUB_ACCESS_TOKEN_1=$GH_TOKEN',
              'export GITHUB_ACCESS_TOKEN_1_OWNER=$OWNER_LC',
              'sudo -u ec2-user bash -c \"cd /home/ec2-user/app && ./deploy.sh\"'
            ]" \
            --query "Command.CommandId" \
            --output text)
          
          echo "✅ Command sent! ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for Deployment Result
        run: |
          echo "⏳ Waiting for deployment to complete..."
          
          # 3. 배포 완료 대기 (최대 10분)
          aws ssm wait command-executed \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --timeout-seconds 600

          # 4. 최종 결과 확인
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          
          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment Failed!"
            aws ssm get-command-invocation \
              --command-id "${{ env.COMMAND_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          else
            echo "🎉 Deployment Success!"
            aws ssm get-command-invocation \
              --command-id "${{ env.COMMAND_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardOutputContent" --output text
          fi